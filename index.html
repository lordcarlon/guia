<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guia de Estudo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guia">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#07090f;--s:#0f141d;--s2:#151b27;--t:#e6ebf2;--m:#8c97aa;--b:#1f2837;--a:#00d9ff;--rgb:0,217,255;--r:#ef4444;--g:#10b981}
body[data-theme=gold]{--bg:#0b0905;--s:#14100a;--s2:#1b160d;--t:#f1e8d0;--m:#948764;--b:#2b2211;--a:#d4af37;--rgb:212,175,55}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t);font-family:"Space Grotesk",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:background .4s}
.mono,.kick,.num,.pill,button{font-family:"Space Mono",ui-monospace,monospace}
header{max-width:860px;margin:0 auto;padding:26px 16px 14px;text-align:center}
.kick{color:var(--a);font-size:.72rem;letter-spacing:2px}
h1{font-size:clamp(1.2rem,6vw,1.9rem);margin:6px 0;letter-spacing:.5px}
.sub{color:var(--m);font-size:.85rem;margin-bottom:16px}
.seg{display:flex;padding:4px;gap:4px;background:var(--s);border:1px solid var(--b);border-radius:14px;max-width:420px;margin:0 auto}
.seg button{flex:1;padding:11px 8px;border:0;border-radius:10px;background:none;color:var(--m);font-size:.74rem;cursor:pointer;transition:.25s}
.seg button[aria-pressed=true]{background:rgba(var(--rgb),.14);color:var(--a);box-shadow:inset 0 0 0 1px rgba(var(--rgb),.5)}
.top{position:sticky;top:env(safe-area-inset-top);z-index:20;background:rgba(7,9,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--b)}
body[data-theme=gold] .top{background:rgba(11,9,5,.92)}
#tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;max-width:860px;margin:0 auto}
#tabs::-webkit-scrollbar{display:none}
.pill{flex:none;white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--b);background:var(--s);color:var(--m);font-size:.72rem;cursor:pointer;transition:.2s}
.pill.on{border-color:var(--a);color:var(--a);background:rgba(var(--rgb),.12)}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:12px 16px 60px}
.tools{display:flex;justify-content:flex-end;margin-bottom:12px}
.tools button{padding:9px 14px;border-radius:10px;border:1px solid var(--b);background:var(--s);color:var(--a);font-size:.72rem;cursor:pointer}
.card{background:var(--s);border:1px solid var(--b);border-top:2px solid var(--a);border-radius:16px;padding:18px 14px;margin-bottom:18px;scroll-margin-top:var(--bar,120px);box-shadow:0 8px 24px rgba(0,0,0,.35);animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.ch{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.num{flex:none;font-size:.68rem;color:var(--a);background:rgba(var(--rgb),.1);border:1px solid rgba(var(--rgb),.3);border-radius:8px;padding:3px 9px;margin-top:2px}
h2{font-size:1rem;line-height:1.4}
.dg{background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:14px 10px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.bx{padding:12px 10px;border-radius:12px;border:1px solid rgba(var(--rgb),.28);background:rgba(var(--rgb),.05);text-align:center;font-size:.76rem;color:var(--m);transition:.2s}
.bx:hover{border-color:var(--a);transform:translateY(-2px)}
.bx i{display:block;font-style:normal;font-size:1.5rem;margin-bottom:3px}
.bx b{display:block;color:var(--a);font-size:.82rem;margin-bottom:3px;overflow-wrap:anywhere}
.fl{display:flex;flex-direction:column;align-items:center;gap:2px}
.st{width:100%;max-width:340px;padding:10px 14px;border-radius:10px;border:1px solid rgba(var(--rgb),.35);background:rgba(var(--rgb),.07);text-align:center;font:.76rem "Space Mono",monospace;color:var(--t)}
.ar{color:var(--a);font-size:1rem;line-height:1}
.ex{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px;padding:12px 14px;min-height:44px;border-radius:10px;border:1px solid rgba(var(--rgb),.4);background:rgba(var(--rgb),.07);color:var(--a);font-size:.75rem;cursor:pointer}
.ex span{transition:transform .25s}
.ex[aria-expanded=true] span{transform:rotate(180deg)}
.nt .xp{transition:none!important}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.xp.open{grid-template-rows:1fr}
.xp>div{overflow:hidden}
.xp p{margin-top:12px;padding:14px;border-left:3px solid var(--a);background:rgba(var(--rgb),.05);border-radius:0 10px 10px 0;font-size:.88rem;color:#c3ccdb;line-height:1.7}
.sec{font:.72rem "Space Mono",monospace;color:var(--a);letter-spacing:2px;margin:26px 0 12px}
.tbl{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:340px;font-size:.78rem}
th{padding:9px;text-align:left;background:rgba(var(--rgb),.1);color:var(--a);font-family:"Space Mono",monospace;font-size:.7rem}
td{padding:9px;border-top:1px solid var(--b);color:var(--m)}
td:first-child{color:var(--a);font-weight:700;white-space:nowrap}
td:nth-child(2){color:var(--t)}
#q{width:100%;padding:12px;margin-bottom:12px;border-radius:10px;border:1px solid var(--b);background:var(--s2);color:var(--t);font-size:.9rem}
.msg{margin-top:14px;text-align:center;color:var(--m);font-size:.85rem}
.bx[data-t],.st[data-t]{cursor:pointer}
.bx.sel,.st.sel{border-color:var(--a);background:rgba(var(--rgb),.2);box-shadow:0 0 0 2px rgba(var(--rgb),.45)}
.bx:focus-visible,.st:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.tp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.tp.open{grid-template-rows:1fr}
.tp>div{overflow:hidden}
.tpi{margin-top:10px;padding:12px 14px;border:1px solid rgba(var(--rgb),.4);border-radius:10px;background:rgba(var(--rgb),.06)}
.tpi b{display:block;color:var(--a);font:.72rem "Space Mono",monospace;letter-spacing:1px;margin-bottom:6px;overflow-wrap:anywhere}
.tpi p{font-size:.85rem;color:#c3ccdb;line-height:1.6}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== V2 INTEGRADA — mantém o design original ===== */
.studybar{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:18px}
.studytop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.studytitle{font:700 .72rem "Space Mono";color:var(--a);letter-spacing:1px}
.studyxp{font:.7rem "Space Mono";color:var(--m)}
.progressbar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden;border:1px solid var(--b)}
.progressbar>i{display:block;height:100%;width:0;background:var(--a);transition:width .35s ease}
.studyactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.studyactions button,.complete,.jump{padding:9px 12px;border-radius:10px;border:1px solid rgba(var(--rgb),.35);background:rgba(var(--rgb),.07);color:var(--a);font:.68rem "Space Mono";cursor:pointer}
.complete.done{color:var(--g);border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.08)}
.v2section{margin-top:28px}
.v2title{font:.72rem "Space Mono";color:var(--a);letter-spacing:2px;margin:0 0 12px}
.v2panel{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:16px;margin-bottom:12px}
.v2grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.v2stat{padding:12px;border:1px solid var(--b);background:var(--s2);border-radius:12px}
.v2stat small{display:block;color:var(--m);font:.66rem "Space Mono"}
.v2stat b{display:block;margin-top:4px;color:var(--a);font-size:1.1rem}
.exq{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:15px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin-top:7px;padding:10px 12px;border-radius:9px;border:1px solid var(--b);background:var(--s2);color:var(--t);font-size:.78rem;cursor:pointer}
.opt.ok{border-color:#10b981;background:rgba(16,185,129,.1);color:#6ee7b7}
.opt.no{border-color:#ef4444;background:rgba(239,68,68,.1);color:#fca5a5}
.achgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.ach{padding:13px;text-align:center;border:1px solid var(--b);background:var(--s2);border-radius:12px;opacity:.42}
.ach.on{opacity:1;border-color:rgba(var(--rgb),.5)}
.ach i{display:block;font-style:normal;font-size:1.3rem}.ach b{display:block;font-size:.75rem;margin-top:4px}.ach small{display:block;color:var(--m);font-size:.62rem;margin-top:3px}
.ans{width:100%;padding:12px;border-radius:10px;border:1px solid var(--b);background:var(--s2);color:var(--t);font:inherit;font-size:.9rem;margin:8px 0}
.opt.sel{border-color:var(--a)!important;background:rgba(var(--rgb),.18)!important}
.complete[disabled]{opacity:.45}
.certbox{text-align:center;padding:22px;border:1px solid rgba(var(--rgb),.45);border-radius:14px;background:rgba(var(--rgb),.05)}
.certbox h3{color:var(--a);font-family:"Space Mono";letter-spacing:1px;margin:5px 0}
.danger{color:#fca5a5!important;border-color:rgba(239,68,68,.4)!important}
@media(max-width:600px){.v2grid{grid-template-columns:repeat(2,1fr)}.achgrid{grid-template-columns:repeat(2,1fr)}}


.case-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.case-btn{flex:1;min-width:150px;padding:11px 12px;min-height:44px;border-radius:10px;border:1px solid rgba(var(--rgb),.4);background:rgba(var(--rgb),.05);color:var(--a);font:.72rem "Space Mono";cursor:pointer}
.case-btn[aria-expanded="true"]{background:rgba(var(--rgb),.16);border-color:var(--a)}
.case{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.case.open{grid-template-rows:1fr}
.case>div{overflow:hidden}
.case-inner{margin-top:10px;padding:14px;border:1px solid rgba(var(--rgb),.35);border-radius:12px;background:rgba(var(--rgb),.035)}
.case-row{padding:10px 0;border-bottom:1px solid var(--b)}
.case-row:last-child{border-bottom:0;padding-bottom:0}
.case-row:first-child{padding-top:0}
.case-row b{display:block;color:var(--a);font:.68rem "Space Mono";letter-spacing:1px;margin-bottom:5px}
.case-row p{margin:0;color:#cbd3df;font-size:.84rem;line-height:1.65}
.case-row.answer{border-left:3px solid var(--a);padding-left:11px}
@media(max-width:430px){.case-actions{display:grid;grid-template-columns:1fr}.case-btn{min-width:0;width:100%}}


/* ========== V11 · TREINO PRÁTICO ========== */
.v11{margin:18px 0 28px}.v11-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}.v11-kick{font:.65rem "Space Mono";letter-spacing:1.5px;color:var(--a)}.v11-title{margin:3px 0;font-size:1.2rem}.v11-score{font:.72rem "Space Mono";white-space:nowrap}.v11-grid{display:grid;gap:12px}.v11-card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border-radius:16px;padding:16px}.v11-card h3{margin:0 0 7px;font-size:1rem}.v11-card .scenario{color:#cbd3df;line-height:1.65;font-size:.86rem;margin-bottom:12px}.v11-opts{display:grid;gap:8px}.v11-opt{width:100%;text-align:left;border:1px solid var(--line);background:#0d1118;color:#e8edf5;border-radius:11px;padding:11px 12px;cursor:pointer;font:inherit;font-size:.82rem;line-height:1.45}.v11-opt:hover{border-color:var(--a)}.v11-opt.correct{border-color:#38d996;background:rgba(56,217,150,.08)}.v11-opt.wrong{border-color:#ff6674;background:rgba(255,102,116,.07)}.v11-feedback{display:none;margin-top:11px;padding:11px 12px;border-left:3px solid var(--a);background:rgba(255,255,255,.025);font-size:.82rem;line-height:1.6;color:#d7dee9}.v11-feedback.open{display:block}.v11-mini{font:.65rem "Space Mono";color:#8f9bab;margin-top:8px}.v11-reset{margin-top:12px}.v11-done{border-color:var(--a)}
@media(min-width:720px){.v11-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.v11-head{align-items:start;flex-direction:column}.v11-score{white-space:normal}}

</style>
</head>
<body data-theme="cyan">
<header>
  <div class="kick">// GUIA DE ESTUDO</div>
  <h1 id="h-title"></h1>
  <p class="sub" id="h-sub"></p>
  <div class="seg" role="group" aria-label="Área de estudo">
    <button data-k="redes" aria-pressed="true">🌐 Redes</button>
    <button data-k="gestao" aria-pressed="false">💼 Gestão de Contas</button>
  </div>
</header>
<div class="top"><nav id="tabs" aria-label="Temas"></nav></div>
<main id="app"></main>

<script>
/* ========== 1. DADOS ========== */
const F=(...s)=>`<div class="fl">${s.map(x=>`<div class="st">${x}</div>`).join('<div class="ar">↓</div>')}</div>`;
const C=(...s)=>`<div class="gr">${s.map(([i,t,d])=>`<div class="bx"><i>${i}</i><b>${t}</b><span>${d||''}</span></div>`).join('')}</div>`;
const L=(tab,title,diagram,exp)=>({tab,title,diagram,exp});

const studyData={
redes:{theme:'cyan',kicker:'REDES',title:'FUNDAMENTOS DE REDES',subtitle:'15 conceitos essenciais, do básico ao TCP/IP',
summary:[F('Dispositivo','Conexão','Rede','Protocolos','Comunicação'),'Redes são dispositivos ligados por regras comuns. Revê os protocolos e as camadas: são a base de tudo.'],
lessons:[
L('Definição','O que são redes?',F('💻 DISPOSITIVO','🌐 REDE','🖥️ DISPOSITIVO'),'Uma rede é um conjunto de dispositivos ligados que trocam dados e partilham recursos, como internet, ficheiros e impressoras. Ex: telemóvel, PC e router lá de casa.'),
L('Objetivo','Objetivo das redes',C(['💬','Comunicação'],['📁','Partilha'],['🔑','Acesso a recursos'],['🗄️','Centralização'],['🔗','Conectividade']),'Ligar dispositivos e pessoas para comunicar, partilhar recursos, aceder a serviços e centralizar dados e gestão.'),
L('Vantagens','Vantagens das redes',C(['💬','Comunicação','Email, chat, vídeo'],['🖨️','Partilha','Menos equipamento'],['⚡','Produtividade','Trabalho colaborativo'],['🛠️','Gestão','Controlo central'],['📈','Escalabilidade','Fácil de crescer']),'Uma rede reduz custos, acelera a troca de informação e permite crescer sem refazer tudo.'),
L('Riscos','Riscos das redes',C(['🎯','Ataques'],['🦠','Malware'],['🕵️','Roubo de dados'],['🚫','Acesso não autorizado'],['⚠️','Falhas'],['⏸️','Indisponibilidade']),'Quanto mais ligada, mais exposta. É preciso segurança (palavras-passe, atualizações, firewall) e planos para falhas.'),
L('LAN/MAN/WAN','LAN, MAN e WAN',C(['🏠','LAN','Casa ou escritório. Ex: Wi-Fi de casa'],['🏙️','MAN','Cidade. Ex: rede de um município'],['🌍','WAN','Países. Ex: a Internet']),'A diferença é o alcance: LAN é local, MAN cobre uma cidade e WAN liga redes a longas distâncias.'),
L('PAN vs LAN','PAN vs LAN',C(['🎧','PAN','Bluetooth e dispositivos pessoais, poucos metros'],['🏢','LAN','Computadores e impressoras de um escritório']),'PAN é a rede pessoal à tua volta (~10 m). LAN cobre um espaço maior, como um edifício.'),
L('Internet=WAN','Internet como WAN',F('💻 Dispositivo','📡 Router','🏭 ISP','🌍 Internet','🖥️ Servidor'),'A Internet é a maior WAN do mundo: o teu router liga ao ISP (operador), que te liga a milhares de outras redes e servidores.'),
L('Cliente/Servidor','Cliente e servidor',F('📱 CLIENTE','📤 PEDIDO','🖥️ SERVIDOR','📥 RESPOSTA','📱 CLIENTE'),'O cliente faz um pedido (request) e o servidor devolve uma resposta (response). Ex: o browser pede uma página e o servidor envia-a.'),
L('Hardware','Hardware de rede',C(['📡','MODEM','Converte o sinal do operador'],['🔀','ROTEADOR','Encaminha dados e cria o Wi-Fi'],['🔌','SWITCH','Liga vários dispositivos por cabo na LAN']),'Modem = porta de entrada. Roteador = distribui e escolhe caminhos. Switch = liga equipamentos dentro da rede local.'),
L('Protocolos','Protocolos',C(['🌐','HTTP','Páginas web'],['🔒','HTTPS','Web segura'],['📖','DNS','Nome → IP'],['🏷️','DHCP','Atribui IPs'],['📂','FTP','Transferir ficheiros'],['✅','TCP','Entrega fiável'],['📍','IP','Endereço e rota']),'Protocolo é um conjunto de regras que permite a dispositivos diferentes se entenderem, como uma língua comum.'),
L('Fio vs Wi-Fi','Rede com fio vs sem fio',C(['🔌','FIO','Mais rápida, estável e segura; sem mobilidade'],['📶','WI-FI','Móvel e prática; mais interferência e risco']),'Compara velocidade, mobilidade, estabilidade, interferência e segurança. Cabo para estabilidade; Wi-Fi para liberdade.'),
L('Topologia','Topologia de rede',C(['⭐','Estrela','Tudo ligado a um ponto central'],['➖','Barramento','Todos num só cabo'],['⭕','Anel','Cada um liga ao seguinte'],['🕸️','Malha','Ligações múltiplas entre nós']),'Topologia é a forma como os dispositivos estão organizados. A estrela é a mais comum hoje.'),
L('Internet vs Web','Internet vs Web',C(['🛣️','INTERNET','A infraestrutura: cabos, routers, protocolos'],['📄','WEB','Um serviço sobre a Internet: sites e browsers']),'A Internet é a estrada; a Web é um dos veículos. Email e jogos online também usam a Internet sem serem Web.'),
L('IP','Endereço IP',C(['🔢','IPv4','192.168.1.10 (32 bits)'],['🔣','IPv6','Muito mais endereços (128 bits)'],['🏠','Privado','Usado dentro da rede local'],['🌍','Público','Visto na Internet']),'O IP identifica e localiza cada dispositivo, como a morada de uma casa.'),
L('TCP/IP','TCP/IP',F('APLICAÇÃO: HTTP, DNS','TRANSPORTE: TCP/UDP','INTERNET: IP','ACESSO À REDE: Wi-Fi, Ethernet'),'Aplicação = serviços usados. Transporte = entrega fiável. Internet = endereços e rotas. Acesso à rede = ligação física.')
]},
gestao:{theme:'gold',kicker:'GESTÃO DE CONTAS',title:'GESTOR DE CONTAS JÚNIOR',subtitle:'18 temas, siglas e termos essenciais',
summary:[F('Cliente','Relacionamento','Valor','Retenção','Expansão'),'Conhece o cliente, cuida da relação, entrega valor. Um júnior mostra curiosidade, organização, empatia e vontade de aprender.'],
lessons:[
L('Papel','O papel do Gestor de Contas',C(['🤝','Relacionamento'],['👀','Acompanhar clientes'],['🔍','Necessidades'],['🛡️','Proteger receita'],['🚀','Criar oportunidades']),'Acompanha o cliente depois da venda, gere a relação, identifica necessidades e ajuda a manter e fazer crescer a receita.'),
L('vs Vendas','Gestor de Contas vs Vendas',C(['🧑‍💼','GESTOR DE CONTAS','Relacionamento, retenção, expansão'],['🎯','VENDAS','Aquisição, prospeção, conversão']),'Funções complementares: vendas conquista, o gestor cuida e expande. Nenhuma é superior.'),
L('Priorizar','Priorização da carteira',C(['🔥','Urgente + importante','Agir já'],['📅','Importante','Planear'],['📨','Urgente','Delegar/responder'],['🗂️','Resto','Acompanhar'],),'Prioriza por valor, risco, potencial, urgência e impacto. Carteira = clientes sob a tua responsabilidade.'),
L('Ciclo de vida','Ciclo de vida do cliente',F('AQUISIÇÃO','ONBOARDING','ADOÇÃO','EXPANSÃO','RETENÇÃO'),'Cada fase pede uma atitude: integrar bem, garantir uso, expandir e renovar.'),
L('Customer Success','Customer Success',C(['🎯','Resultados'],['📊','Adoção'],['💎','Valor percebido'],['🛡️','Prevenir churn']),'CS ajuda o cliente a obter resultados com o serviço. O gestor usa esses dados para reter e fazer crescer a conta.'),
L('Insatisfeito','Cliente insatisfeito',F('OUVIR','ENTENDER','VALIDAR','RESOLVER','ACOMPANHAR'),'Não interrompas nem te defendas. Mostra que percebeste, propõe solução com prazos e faz follow-up até ficar resolvido.'),
L('Upsell/Cross-sell','Upsell e Cross-sell',C(['⬆️','UPSELL','Versão ou plano superior'],['↔️','CROSS-SELL','Produto ou serviço complementar']),'Ex: Upsell = Básico → Premium. Cross-sell = suporte técnico + cibersegurança. Ambos aumentam receita sem novos clientes.'),
L('QBR','Reunião QBR',F('RESULTADOS','MÉTRICAS','PROBLEMAS','OPORTUNIDADES','PRÓXIMOS PASSOS'),'QBR = Quarterly Business Review: reunião trimestral para rever resultados e alinhar o que vem a seguir.'),

/* ========== EXPLICAÇÕES INDIVIDUAIS (chave = rótulo em minúsculas; "area.card:rotulo" tem prioridade) ========== */
const CASES={"redes":{"Definição":["Uma pequena empresa instala dois computadores, uma impressora e um router. A equipa precisa trocar ficheiros e usar a mesma ligação à Internet.","Os equipamentos precisam comunicar entre si e partilhar recursos.","Definir como os dispositivos serão ligados e quais regras permitirão a troca de dados.","Os equipamentos passam a comunicar de forma organizada, formando uma rede.","O que é uma rede de computadores?","É um conjunto de dispositivos ligados para comunicar e partilhar dados ou recursos."],"Objetivo":["Numa loja, três funcionários precisam aceder à mesma impressora e trocar documentos durante o dia.","Cada pessoa está a trabalhar isoladamente, repetindo tarefas e partilhando ficheiros manualmente.","Criar uma rede que permita comunicação, partilha de recursos e acesso controlado.","O trabalho fica mais rápido e os recursos podem ser usados por várias pessoas.","Qual é o principal objetivo de uma rede?","Permitir comunicação, partilha de recursos e acesso a serviços entre dispositivos."],"Vantagens":["Um escritório cresce de 5 para 15 funcionários e percebe que cada computador tem recursos isolados.","Há duplicação de equipamentos e dificuldade em colaborar.","Usar uma rede para partilhar impressoras, ficheiros, Internet e serviços.","A empresa reduz desperdícios e melhora a colaboração.","Que vantagem uma rede pode trazer para uma empresa?","Partilha de recursos, melhor comunicação, produtividade e facilidade de expansão."],"Riscos":["Uma empresa começa a ligar muitos dispositivos à rede, mas mantém palavras-passe fracas e equipamentos desatualizados.","Quanto mais dispositivos ligados, maior é a superfície de ataque.","Aplicar palavras-passe fortes, atualizações, controlo de acesso e firewall.","O risco de acesso indevido, malware e indisponibilidade é reduzido.","Que cuidados básicos reduzem os riscos de uma rede?","Atualizações, palavras-passe fortes, firewall e controlo de acesso."],"LAN/MAN/WAN":["Uma empresa tem computadores num escritório, filiais na mesma cidade e outras noutros países.","As redes têm alcances diferentes.","Classificar a rede conforme a área coberta: LAN, MAN ou WAN.","Fica mais fácil escolher tecnologias e compreender a ligação entre locais.","Qual é a diferença entre LAN, MAN e WAN?","LAN é local, MAN cobre uma área metropolitana e WAN liga redes a grandes distâncias."],"PAN vs LAN":["Um funcionário liga os seus auriculares Bluetooth ao telemóvel e, no escritório, liga computadores e impressoras à rede da empresa.","São dois ambientes de rede com alcances diferentes.","Identificar a ligação pessoal como PAN e a rede do escritório como LAN.","Cada conceito fica associado ao contexto correto.","Dê um exemplo de PAN e de LAN.","Bluetooth entre dispositivos pessoais é PAN; computadores de um escritório formam uma LAN."],"Internet=WAN":["Em casa, o telemóvel liga-se ao Wi-Fi. O router comunica com o operador, que encaminha o tráfego para servidores espalhados pelo mundo.","O utilizador vê uma única Internet, mas por trás existem muitas redes interligadas.","Perceber o papel do router, do ISP e das redes que formam a Internet.","Um dispositivo local consegue comunicar com serviços noutras redes.","Por que podemos considerar a Internet uma WAN?","Porque interliga enormes quantidades de redes através de grandes distâncias."],"Cliente/Servidor":["Um funcionário abre um site no telemóvel. O navegador envia um pedido e um computador remoto responde com os dados da página.","Existe quem solicita o recurso e quem o fornece.","Identificar o dispositivo que faz o pedido como cliente e o que responde como servidor.","A comunicação passa a ser entendida como pedido e resposta.","Como funciona o modelo cliente-servidor?","O cliente faz um pedido e o servidor processa e devolve uma resposta."],"Hardware":["Uma casa tem sinal do operador, vários dispositivos e precisa de Wi-Fi. O técnico instala os equipamentos adequados.","Cada equipamento cumpre uma função diferente.","Distinguir modem, router e switch antes de fazer a ligação.","Cada componente passa a ter uma função clara na rede.","Qual é a diferença entre modem, router e switch?","O modem liga ao sinal do operador, o router encaminha e distribui a rede, e o switch liga dispositivos numa LAN."],"Protocolos":["Um navegador precisa encontrar o servidor de um site e trocar dados com ele.","Dispositivos diferentes precisam de regras comuns para se entenderem.","Relacionar DNS, IP, HTTP/HTTPS e TCP com as suas funções.","O pedido consegue chegar ao destino e ser interpretado corretamente.","Por que os protocolos são importantes?","Porque definem regras comuns para que dispositivos e serviços consigam comunicar."],"Fio vs Wi-Fi":["Num escritório, alguns computadores precisam de estabilidade máxima, enquanto os funcionários usam telemóveis em movimento.","Nem todos os dispositivos têm a mesma necessidade.","Usar cabo onde estabilidade e desempenho são prioritários e Wi-Fi onde mobilidade é importante.","A rede atende diferentes necessidades sem escolher uma única tecnologia para tudo.","Quando escolher cabo em vez de Wi-Fi?","Quando estabilidade, menor interferência e desempenho previsível forem prioritários."],"Topologia":["Uma empresa quer ligar vários computadores a um equipamento central para facilitar a gestão e identificar falhas.","A forma como os equipamentos são interligados influencia manutenção e disponibilidade.","Escolher uma topologia adequada, como estrela.","Uma falha num cabo individual não derruba necessariamente toda a rede.","O que é a topologia de rede?","É a forma como os dispositivos e ligações estão organizados."],"Internet vs Web":["Uma pessoa diz que “a Web é a Internet”, mas usa também email e uma aplicação de mensagens.","Nem todos os serviços que usam a Internet são páginas Web.","Separar a infraestrutura Internet dos serviços que funcionam sobre ela.","O conceito deixa de ser confundido: Web é um serviço da Internet.","Qual é a diferença entre Internet e Web?","A Internet é a infraestrutura global de redes; a Web é um serviço que funciona sobre ela."],"IP":["Um computador precisa comunicar com outro dispositivo numa rede. Para isso, cada dispositivo precisa ser identificado.","Sem endereçamento, os dados não saberiam para onde ir.","Usar endereços IP para identificar e encaminhar o tráfego.","Os pacotes conseguem encontrar o destino correto.","Para que serve um endereço IP?","Para identificar e permitir localizar logicamente um dispositivo numa rede."],"TCP/IP":["Uma aplicação envia dados pela Internet. Esses dados precisam sair da aplicação, ser transportados e encaminhados até ao destino.","Cada camada resolve uma parte do problema.","Relacionar aplicação, transporte, Internet e acesso à rede.","O percurso dos dados deixa de parecer uma única operação e passa a ser compreendido por etapas.","O que é o modelo TCP/IP?","É um conjunto de camadas e protocolos que organizam a comunicação em redes, incluindo a Internet."]},"gestao":{"Papel":["Uma empresa acabou de vender um serviço a um cliente. Depois da venda, o cliente ainda precisa de acompanhamento, respostas e orientação.","A venda terminou, mas a relação e os resultados continuam.","O Gestor de Contas acompanha a conta, entende necessidades, coordena equipas e procura preservar valor.","O cliente recebe acompanhamento contínuo e a empresa protege a relação.","Qual é o papel de um Gestor de Contas?","Gerir a relação, acompanhar resultados, identificar necessidades e ajudar a reter e desenvolver a conta."],"vs Vendas":["Um vendedor conquista um novo cliente. Depois da contratação, surge a necessidade de acompanhar a utilização e a satisfação.","Aquisição e gestão da relação são momentos diferentes.","Separar claramente a responsabilidade comercial inicial da gestão contínua da conta.","As duas funções trabalham em conjunto sem serem confundidas.","Qual é a diferença entre Vendas e Gestão de Contas?","Vendas foca aquisição e conversão; Gestão de Contas foca relacionamento, retenção e expansão."],"Priorizar":["Um Gestor recebe ao mesmo tempo uma reclamação urgente, uma reunião importante e vários pedidos de baixa prioridade.","Nem tudo pode ser tratado com a mesma urgência.","Avaliar impacto, risco, urgência, valor do cliente e prazo antes de agir.","Os assuntos críticos são tratados primeiro sem perder o controlo da carteira.","Como priorizaria uma carteira com muitos pedidos?","Usaria impacto, risco, urgência, valor e prazos para ordenar as tarefas."],"Ciclo de vida":["Uma nova empresa contrata o serviço. Primeiro precisa ser integrada, depois aprender a utilizá-lo e, mais tarde, pode expandir.","As necessidades mudam ao longo do relacionamento.","Adaptar o acompanhamento à fase do cliente.","Cada etapa recebe a atenção adequada e aumenta a probabilidade de retenção.","Por que conhecer o ciclo de vida do cliente é importante?","Porque as necessidades e ações do gestor mudam desde aquisição até retenção e expansão."],"Customer Success":["Um cliente paga pelo serviço, mas utiliza apenas uma pequena parte dos recursos disponíveis.","Ter contrato não significa necessariamente obter valor.","Analisar adoção, resultados e obstáculos e ajudar o cliente a atingir os seus objetivos.","O cliente aumenta o valor percebido e a relação fica mais sustentável.","O que significa Customer Success?","Ajudar o cliente a obter resultados e valor real através do serviço."],"Insatisfeito":["Um cliente liga irritado porque um problema está a afetar o seu trabalho.","Responder defensivamente pode aumentar o conflito.","Ouvir, entender o impacto, validar a preocupação, apresentar um plano com prazo e fazer follow-up.","O problema é tratado e o cliente sabe o que esperar.","Como lidaria com um cliente insatisfeito?","Ouviria sem interromper, entenderia o problema, apresentaria uma solução e acompanharia até à resolução."],"Upsell/Cross-sell":["Um cliente usa um plano básico e começa a precisar de mais capacidade. Também demonstra interesse num serviço complementar.","Existem necessidades diferentes: ampliar o que já usa ou adicionar algo complementar.","Identificar se existe uma necessidade real antes de propor upsell ou cross-sell.","A expansão é baseada no valor para o cliente, não numa venda forçada.","Qual é a diferença entre upsell e cross-sell?","Upsell aumenta o nível do produto; cross-sell adiciona um produto ou serviço complementar."],"QBR":["A cada trimestre, o Gestor reúne-se com um cliente para rever resultados, problemas e prioridades.","Sem uma revisão periódica, pequenos problemas podem passar despercebidos.","Preparar métricas, resultados, desafios, oportunidades e próximos passos.","Cliente e empresa saem da reunião com prioridades alinhadas.","O que é uma QBR?","Uma Quarterly Business Review: revisão periódica do negócio, resultados e próximos passos com o cliente."],"Métricas":["Um cliente diz que está satisfeito, mas os dados mostram queda de utilização e aumento de cancelamentos.","Uma única opinião não mostra toda a saúde da conta.","Cruzar métricas como NPS, CSAT, churn, NRR, MRR e ARR conforme o contexto.","O gestor consegue identificar sinais de risco e oportunidades com mais objetividade.","Por que acompanhar métricas?","Porque ajudam a transformar a saúde da conta em sinais observáveis para orientar decisões."],"Expectativas":["Um cliente pede uma entrega para amanhã, mas a equipa técnica precisa de cinco dias.","Prometer um prazo impossível cria frustração futura.","Explicar a limitação, alinhar um prazo realista e apresentar alternativas quando existirem.","O cliente sabe o que esperar e a empresa mantém credibilidade.","Como geriria uma expectativa que não pode cumprir?","Seria transparente, explicaria o motivo, proporia alternativas e confirmaria um prazo realista."],"CRM":["Um Gestor assume uma carteira com dezenas de clientes e precisa saber contactos, reuniões, oportunidades e histórico.","Guardar informação apenas na memória ou em mensagens dispersas cria risco.","Registar informações relevantes no CRM de forma organizada e atualizada.","Qualquer pessoa autorizada consegue compreender o estado da conta.","Para que serve um CRM?","Para centralizar e organizar dados, contactos, atividades, oportunidades e histórico do relacionamento."],"Oportunidades":["Durante uma reunião, o cliente comenta que abriu uma nova unidade e está a contratar mais pessoas.","Esse crescimento pode criar novas necessidades.","Fazer perguntas para entender o impacto e verificar se existe uma oportunidade real.","O gestor identifica uma possível expansão antes de simplesmente oferecer um produto.","Como identificar uma oportunidade numa conta?","Observando mudanças no negócio, utilização, necessidades e problemas e fazendo perguntas de diagnóstico."],"30-60-90":["Um novo Gestor entra na empresa e recebe uma carteira. Nos primeiros meses precisa aprender, executar e começar a gerar resultados.","Tentar mudar tudo na primeira semana pode criar erros e resistência.","Usar 30 dias para aprender, 60 para executar e melhorar, e 90 para consolidar resultados e prioridades.","A entrada é organizada e baseada em aprendizagem progressiva.","O que faria nos primeiros 90 dias?","Primeiro aprenderia e observaria; depois executaria melhorias; por fim consolidaria resultados e um plano de continuidade."],"Equipas":["Um cliente tem um problema técnico, mas a solução depende de Suporte e Produto, enquanto Financeiro trata uma questão contratual.","O Gestor não resolve tudo sozinho.","Traduzir a necessidade do cliente para cada equipa, alinhar prioridades e acompanhar até à conclusão.","As equipas trabalham coordenadas e o cliente tem um ponto de contacto claro.","Qual é o papel do Gestor perante as equipas internas?","Ser a ponte entre cliente e equipas, alinhando necessidades, prioridades e acompanhamento."],"SLA":["Um cliente possui um SLA que exige resposta a incidentes críticos dentro de determinado prazo. Surge um incidente urgente.","O tempo de resposta faz parte do compromisso assumido.","Verificar prioridade, acionar a equipa correta e acompanhar o cumprimento do SLA.","O cliente recebe resposta dentro do compromisso ou é informado de forma transparente sobre a situação.","O que é um SLA?","É um acordo que define níveis de serviço, como tempos de resposta, resolução ou disponibilidade."],"Medir sucesso":["Uma conta mantém o contrato, mas quase não utiliza o serviço e não demonstra crescimento.","Retenção isolada não conta toda a história.","Avaliar retenção, receita, satisfação, adoção e expansão em conjunto.","O gestor tem uma visão mais completa da saúde da conta.","Como mediria o sucesso de uma conta?","Combinaria retenção, receita, satisfação, adoção e expansão, conforme os objetivos definidos."],"Retenção":["Um cliente começa a reclamar de atrasos e usa menos o serviço. Ainda não falou em cancelar.","São sinais de risco que podem aparecer antes do churn.","Investigar a causa, recuperar valor, envolver as equipas certas e acompanhar de forma preventiva.","O risco é tratado antes de chegar ao cancelamento.","Como trabalharia a retenção de um cliente em risco?","Identificaria a causa do risco, criaria um plano de recuperação de valor e faria acompanhamento próximo."],"Segmentação ABC":["Um Gestor tem muitos clientes e não consegue dedicar o mesmo tempo a todos.","Algumas contas têm maior valor, potencial ou risco estratégico.","Classificar clientes com critérios definidos pela empresa e ajustar o nível de acompanhamento.","O tempo é distribuído de acordo com prioridade e importância.","Para que serve a segmentação ABC?","Para organizar a carteira por critérios de importância e definir diferentes níveis de atenção."]}};

function cardHTML(id,num,title,diagram,exp){

   <div class="v2stat"><small>⚡ XP</small><b>${state.xp}</b></div>
   <div class="v2stat"><small>🏅 Nível</small><b>${level()}</b></div>
   <div class="v2stat"><small>🔁 Para rever</small><b>${wr.length}</b></div>
 </div><p class="msg">${dn} de ${tot} aulas concluídas · ${Math.round(dn/tot*100)}%</p>`}
 const n=completedTotal(), qn=state.nAns;
 const ach=[['🌱','Primeiro passo','1 aula',n>=1],['📚','Estudante','5 aulas',n>=5],['⚡','Constante','10 aulas',n>=10],['🌐','Mestre das Redes','15 Redes',state.done.redes.length>=15],['💼','Gestor Júnior','18 Gestão',state.done.gestao.length>=18],['📝','Praticante','8 exercícios',qn>=8],['💎','1000 XP','1000 XP',state.xp>=1000],['🎓','Aprovado em Redes','Final Redes',state.final.redes.paid],['🎓','Aprovado em Gestão','Final Gestão',state.final.gestao.paid],['🏆','Curso completo','33 aulas',n>=33]];
 const ap=$('#achPanel');if(ap)ap.innerHTML=`<div class="achgrid">${ach.map(x=>`<div class="ach ${x[3]?'on':''}"><i>${x[0]}</i><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>`;
 const cp=$('#certPanel');if(cp)cp.innerHTML=n>=33?`<div class="certbox"><div class="kick">CERTIFICADO DE CONCLUSÃO</div><h3>GUIA DE ESTUDO</h3><p>Fundamentos de Redes + Gestor de Contas Júnior</p><p class="msg">${new Date().toLocaleDateString('pt-PT')}</p><button class="complete" data-print>🖨️ Imprimir / Guardar</button></div>`:`<div class="certbox"><h3>Certificado bloqueado</h3><p class="msg">Conclui as 33 aulas para desbloquear.</p><b>${n}/33</b></div>`;
}
function completeLesson(n){
 const a=state.done[state.area],i=a.indexOf(n);
 if(i<0){a.push(n);state.xp+=100}else{a.splice(i,1);state.xp=Math.max(0,state.xp-100)}
 const y=window.scrollY,abertos=[...document.querySelectorAll('.card.open')].map(c=>c.id);
 persist();renderApp();
 abertos.forEach(id=>{const c=document.getElementById(id);if(c)setOpen(c,true)});
 window.scrollTo({top:y,behavior:'instant'});
}
function answerV2(id,j){
 if(state.answers[id]!==undefined)return;
 keepScroll(()=>{
  state.answers[id]=j;state.nAns++;
  if(j===BANK[id][3]){if(!state.ok.includes(id)){state.ok.push(id);state.xp+=25}state.wrong=state.wrong.filter(x=>x!==id)}
  else if(!state.wrong.includes(id))state.wrong.push(id);
  persist();renderApp();
 });
}
function answerRev(id,j){
 keepScroll(()=>{
  if(j===BANK[id][3]){state.wrong=state.wrong.filter(x=>x!==id);delete state.revTry[id]}
  else(state.revTry[id]=state.revTry[id]||[]).push(j);
  persist();renderApp();
 });
}
function newSet(){keepScroll(()=>{ensureSet(true);renderApp()})}
function resetV2(){
 if(confirm('Apagar todo o progresso, XP e respostas?')){
  localStorage.removeItem('guia_estudo_v2');
  state.area='redes';state.all=false;state.xp=0;state.done={redes:[],gestao:[]};state.answers={};state.ok=[];state.wrong=[];state.nAns=0;state.set=null;state.week=null;state.round=0;state.sets={};state.weeks={};state.rounds={};state.revTry={};state.final=freshFinal();state.unl={redes:1,gestao:1};state.lt={redes:{},gestao:{}};state.seen={redes:[],gestao:[]};state.exw={};state.rvw={};state.v11={redes:{score:0,done:[]},gestao:{score:0,done:[]}};
  renderApp();
 }
}
function enhance(){
  document.querySelectorAll('.card').forEach(c=>{
    let n=0;
    c.querySelectorAll('.dg .bx,.dg .st').forEach(el=>{
      const raw=(el.querySelector('b')||el).textContent,k=norm(raw);
      const t=TIP[state.area+'.'+c.id+':'+k]||TIP[k];
      if(!t)return;
      el.dataset.t=t;
      el.dataset.l=((el.querySelector('i')?el.querySelector('i').textContent+' ':'')+raw.split(':')[0]).toUpperCase();
      el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-pressed','false');n++;
    });
    if(n)c.querySelector('.dg').insertAdjacentHTML('afterend','<div class="tp" aria-live="polite"><div><div class="tpi"><b></b><p></p></div></div></div>');
  });
}
function pickItem(el){
  const c=el.closest('.card'),tp=c.querySelector('.tp'),same=el.classList.contains('sel');
  c.querySelectorAll('.sel').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-pressed','false')});
  if(same){tp.classList.remove('open');return}
  el.classList.add('sel');el.setAttribute('aria-pressed','true');
  tp.querySelector('b').textContent=el.dataset.l;tp.querySelector('p').textContent=el.dataset.t;
  tp.classList.add('open');
}
function renderGlossary(q){
  const d=studyData.gestao,f=d.termos.filter(t=>t.join(' ').toLowerCase().includes(q.toLowerCase().trim()));
  $('#g').innerHTML=f.length?tableHTML(['Termo','Definição'],f):'<p class="msg">Nenhum termo encontrado.</p>';
}
function filterGlossary(e){renderGlossary(e.target.value)}

function renderTabs(d){
  const a=state.area,u=state.unl[a],items=[];
  for(let k=0;k<lvCount(a);k++){
    if(k<u){d.lessons.slice(k*LVN,k*LVN+LVN).forEach((l,i)=>{const n=k*LVN+i+1;items.push(['lesson-'+pad(n),lvVisible(a,n)?pad(n)+' '+l.tab:'🔒 '+pad(n)])});items.push(['teste-'+(k+1),(lvAllDone(a,k)?'🧪 ':'🔒 ')+'Teste '+(k+1)])}
    else items.push(['nivel-'+(k+1),'🔒 Nível '+(k+1)]);
  }
  items.push(['v11','🎯 Treino V11'],['avaliacao','🎓 Avaliação']);
  if(d.siglas)items.push(['siglas','Siglas'],['termos','Termos']);
  items.push(['resumo','Resumo']);
  tabs.innerHTML=items.map(([id,t])=>`<button class="pill" data-target="${id}">${t}</button>`).join('');
  setActiveTab(items[0][0]);
}

/* ========== 4. NAVEGAÇÃO ========== */
function setActiveTab(id){
  tabs.querySelectorAll('.pill').forEach(p=>{
    const on=p.dataset.target===id;p.classList.toggle('on',on);
    if(on)tabs.scrollTo({left:p.offsetLeft-tabs.clientWidth/2+p.offsetWidth/2,behavior:'smooth'});
  });
}
function barOffset(){
  const t=document.querySelector('.top');
  return (parseFloat(getComputedStyle(t).top)||0)+t.offsetHeight;
}
function updateBar(){document.documentElement.style.setProperty('--bar',(barOffset()+12)+'px')}
function scrollToLesson(id){
  const el=document.getElementById(id);if(!el)return;
  state.lock=Date.now()+1200;
  app.classList.add('nt');                       /* fecha as outras SEM animação, para o destino não se mover */
  document.querySelectorAll('.card').forEach(c=>{if(c!==el)setOpen(c,false)});
  void app.offsetHeight;
  app.classList.remove('nt');
  setOpen(el,true);                              /* abre só o destino (cresce para baixo) */
  setActiveTab(id);
  updateBar();
  const y=el.getBoundingClientRect().top+window.scrollY-barOffset()-12;
  window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
}
function observe(){
  obs&&obs.disconnect();
  obs=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&Date.now()>(state.lock||0)&&setActiveTab(e.target.dataset.tab)),{rootMargin:'-120px 0px -65% 0px'});
  document.querySelectorAll('[data-tab]').forEach(c=>obs.observe(c));
}

/* ========== 5. INTERAÇÕES ========== */
function markSeen(card){
 const n=Number(card.dataset.lesson);if(!n)return;
 const sn=state.seen[state.area];if(sn.includes(n))return;
 sn.push(n);persist();
 const b=card.querySelector('[data-complete]');
 if(b&&b.disabled&&!b.classList.contains('done')){b.disabled=false;b.innerHTML='□ Marcar aula como concluída <span>+100 XP</span>'}
}
function setOpen(card,open){
 if(open)markSeen(card);
  const b=card.querySelector('.ex');if(!b)return;
  b.setAttribute('aria-expanded',open);
  b.firstChild.textContent=open?'Ocultar explicação':'Ver explicação';
  card.querySelector('.xp').classList.toggle('open',open);
}
function toggleExplanation(card){setOpen(card,card.querySelector('.ex').getAttribute('aria-expanded')!=='true')}
function toggleAll(){
  state.all=!state.all;
  document.querySelectorAll('.card').forEach(c=>setOpen(c,state.all));
  $('#all').textContent=state.all?'Ocultar todas as explicações':'Mostrar todas as explicações';
}
function switchSection(k){if(k!==state.area){state.area=k;persist();renderApp()}}

/* ========== 6. EVENTOS / RESPONSIVIDADE ========== */
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button');b&&switchSection(b.dataset.k)});
tabs.addEventListener('click',e=>{const p=e.target.closest('.pill');p&&scrollToLesson(p.dataset.target)});
app.addEventListener('click',e=>{
  const cb=e.target.closest('[data-case-toggle]');
  if(cb){
    const panel=document.getElementById(cb.dataset.caseToggle);
    if(!panel)return;
    const open=cb.getAttribute('aria-expanded')==='true';
    if(!open){const card=cb.closest('.card');if(card)markSeen(card)}
    cb.setAttribute('aria-expanded',String(!open));
    cb.textContent=!open?'📕 Ocultar situação prática':'📖 Ver situação prática';
    panel.classList.toggle('open',!open);
    return;
  }
  const v=e.target.closest('[data-v11]');if(v){const [i,j]=v.dataset.v11.split(':').map(Number);return v11Answer(i,j)}
  if(e.target.closest('[data-v11reset]'))return v11Reset();
  const c=e.target.closest('[data-complete]');if(c)return completeLesson(Number(c.dataset.complete));
  const wk=e.target.closest('[data-wk]');if(wk)return wCheck(wk.dataset.wk);
  const wv=e.target.closest('[data-wv]');if(wv)return wVerdict(wv.dataset.wv);
  const wc=e.target.closest('[data-wc]');if(wc)return wCopy(wc.dataset.wc);
  const wr=e.target.closest('[data-wr]');if(wr)return wRetry(wr.dataset.wr);
  const rv=e.target.closest('[data-rev]');if(rv){const [i,j]=rv.dataset.rev.split(':').map(Number);return answerRev(i,j)}
  if(e.target.closest('[data-newset]'))return newSet();
  const fn=e.target.closest('[data-fin]');if(fn){const [i,j]=fn.dataset.fin.split(':').map(Number);return finAnswer(i,j)}
  if(e.target.closest('[data-finsubmit]'))return finSubmit();
  if(e.target.closest('[data-finretry]'))return finRetry();
  const lq=e.target.closest('[data-lt]');if(lq){const [k,i,j]=lq.dataset.lt.split(':').map(Number);return ltAnswer(k,i,j)}
  const ls=e.target.closest('[data-ltsubmit]');if(ls)return ltSubmit(+ls.dataset.ltsubmit);
  const lr=e.target.closest('[data-ltretry]');if(lr)return ltRetry(+lr.dataset.ltretry);
  const cp=e.target.closest('[data-copy]');if(cp){const [a,k]=cp.dataset.copy.split(':');return copyPrompt(a,+k)}
  const j=e.target.closest('[data-jump]');if(j){document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(e.target.id==='resetV2'){resetV2();return}
  if(e.target.closest('[data-print]')){window.print();return}
  const it=e.target.closest('[data-t]');if(it)return pickItem(it);
  const x=e.target.closest('.ex');if(x)return toggleExplanation(x.closest('.card'));
  if(e.target.id==='all')toggleAll();
});
app.addEventListener('keydown',e=>{const it=e.target.closest&&e.target.closest('[data-t]');if(it&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pickItem(it)}});
app.addEventListener('input',e=>{if(e.target.id==='q')filterGlossary(e);if(e.target.dataset&&e.target.dataset.w)return wInput(e.target);
  if(e.target.id&&e.target.id.startsWith('ta-')){const k=+e.target.id.slice(3),t=lt(state.area,k);t.open=e.target.value;persist();const b=document.querySelector('[data-ltsubmit="'+k+'"]');if(b)b.disabled=!ltReady(state.area,k)}});
/* ===== RESPOSTAS ESCRITAS (sobrepõem as versões de escolha múltipla) ===== */
const STOP=['para','que','com','uma','dos','das','por','mais','entre','como','sem','numa','pela','pelo','esta','este','isso','sobre'];
const VL={ok:['✓ Acertei','g'],mid:['~ Quase','gold'],no:['✕ Errei','red']};
function rec(ctx,id){
 const p=ctx.split(':');let o;
 if(p[0]==='ex')o=state.exw;else if(p[0]==='rv')o=state.rvw;
 else if(p[0]==='lt'){const t=lt(p[1],+p[2]);o=t.w=t.w||{}}
 else{const f=state.final[p[1]];o=f.w=f.w||{}}
 return o[id]||(o[id]={t:'',c:false,v:''});
}
function kwOf(id){const q=BANK[id],t=nrm(q[2][q[3]]),ws=t.split(/[^a-z0-9]+/);let k=ws.filter(w=>w.length>=4&&!STOP.includes(w));if(!k.length)k=ws.filter(w=>w.length>=2);return [...new Set(k.map(w=>w.slice(0,5)))]}
function grade(id,text){const k=kwOf(id),t=nrm(text);if(!k.length)return 'mid';const r=k.filter(w=>t.includes(w)).length/k.length;return r>=.5?'ok':r>=.25?'mid':'no'}
function copyText(t,btn){
 const ok=()=>{if(btn)btn.textContent='✓ Copiado! Cola no Claude'};
 const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove();ok()};
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok).catch(fb);else fb();
}
function wqHTML(ctx,id,n,mode,done){
 const q=BANK[id],r=rec(ctx,id),k=ctx+'|'+id,show=mode==='live'?r.c:done,lock=show?'readonly':'';
 let h=`<div class="exq"><b>${n}. ${q[1]}</b><textarea class="ans" rows="2" data-w="${k}" placeholder="Escreve a tua resposta..." ${lock}>${esc(r.t)}</textarea>`;
 if(show){
  const chips=mode==='live'?Object.entries(VL).map(([v,[l,c]])=>`<button class="tag ${c}" style="${r.v===v?'':'opacity:.4'}" data-wv="${k}|${v}">${l}</button>`).join(''):`<span class="tag ${VL[r.v||'no'][1]}">${VL[r.v||'no'][0]}</span>`;
  h+=`<p class="msg"><b>Resposta esperada:</b> ${esc(q[2][q[3]])}</p><div class="tags">${chips}</div><button class="complete" data-wc="${k}">🤖 Corrigir com Claude (copiar)</button>`;
  if(mode==='live'&&r.v!=='ok')h+=`<button class="complete" data-wr="${k}">↺ Tentar de novo</button>`;
 }else if(mode==='live')h+=`<button class="complete" data-wk="${k}" ${r.t.trim().length<2?'disabled':''}>Verificar</button>`;
 return h+'</div>';
}
function applyV(ctx,id){
 const r=rec(ctx,id);
 if(r.v==='ok'){if(ctx==='ex'&&!state.ok.includes(id)){state.ok.push(id);state.xp+=25}state.wrong=state.wrong.filter(x=>x!==id);if(ctx==='rv')delete state.rvw[id]}
 else if(r.v==='no'&&!state.wrong.includes(id))state.wrong.push(id);
}
function wCheck(k){const [ctx,id]=k.split('|'),r=rec(ctx,+id);if(r.t.trim().length<2)return;r.c=true;r.v=grade(+id,r.t);state.nAns++;keepScroll(()=>{applyV(ctx,+id);persist();renderApp()})}
function wVerdict(k){const [ctx,id,v]=k.split('|'),r=rec(ctx,+id);r.v=v;keepScroll(()=>{applyV(ctx,+id);persist();renderApp()})}
function wRetry(k){const [ctx,id]=k.split('|'),r=rec(ctx,+id);r.c=false;r.v='';persist();keepScroll(renderApp)}
function wCopy(k){const [ctx,id]=k.split('|'),r=rec(ctx,+id),q=BANK[+id];copyText(`Corrige a minha resposta (guia de estudo de Redes e Gestão de Contas).\nPergunta: ${q[1]}\nA minha resposta: ${r.t}\nResposta esperada: ${q[2][q[3]]}\nDiz o que está certo, o que falta e dá uma nota de 0 a 10.`,document.querySelector('[data-wc="'+k+'"]'))}
function ltReady(a,k){const ctx='lt:'+a+':'+k;return lvSet(a,k).every(id=>rec(ctx,id).t.trim().length>=2)&&lt(a,k).open.trim().length>=20}
function finReady(a){return finSet(a).every(id=>rec('fin:'+a,id).t.trim().length>=2)}
function wInput(el){
 const [ctx,id]=el.dataset.w.split('|');rec(ctx,+id).t=el.value;persist();
 const b=document.querySelector('[data-wk="'+el.dataset.w+'"]');if(b)b.disabled=el.value.trim().length<2;
 const ls=document.querySelector('[data-ltsubmit]');if(ls)ls.disabled=!ltReady(state.area,+ls.dataset.ltsubmit);
 const fs=document.querySelector('[data-finsubmit]');if(fs)fs.disabled=!finReady(state.area);
}
function testHTML(a,k){
 const t=lt(a,k),ids=lvSet(a,k),ctx='lt:'+a+':'+k,o=OPENQ[a][k],txt=nrm(t.open),last=k===lvCount(a)-1;
 const qs=ids.map((id,i)=>wqHTML(ctx,id,i+1,'test',t.done)).join('');
 let fb='';
 if(t.done){const ks=o[2].map(w=>[w.split('|')[0],w.split('|').some(x=>txt.includes(nrm(x)))]);
  fb=`<p class="msg"><b>Resposta modelo:</b> ${o[1]}</p><div class="tags">${ks.map(([w,ok])=>`<span class="tag ${ok?'g':'red'}">${ok?'✓':'✕'} ${w}</span>`).join('')}</div><button class="complete" data-copy="${a}:${k}">🤖 Corrigir com Claude (copiar)</button><a class="complete" style="display:block;text-align:center;text-decoration:none" href="https://claude.ai" target="_blank" rel="noopener">Abrir o Claude ↗</a>`}
 const open=`<div class="exq"><b>✍️ ${o[0]}</b><textarea class="ans" id="ta-${k}" rows="4" placeholder="Escreve a tua resposta (mín. 20 letras)..." ${t.done?'readonly':''}>${esc(t.open)}</textarea>${fb}</div>`;
 const fim=t.done?`<div class="certbox"><h3>${t.score}/5 · ${t.pass?'✅ NÍVEL SUPERADO':'❌ AINDA NÃO'}</h3><p class="msg">${t.pass?(last?'Último nível! A Avaliação final está aberta.':'🔓 Nível '+(k+2)+' desbloqueado.'):'Precisas de 3 certas e da resposta longa. Revê e tenta de novo.'}</p></div>`+(t.pass?`<button class="complete" data-jump="${last?'avaliacao':'lesson-'+pad(k*LVN+LVN+1)}">➡️ ${last?'Ir para a Avaliação final':'Começar o Nível '+(k+2)}</button>`:'')+`<button class="complete" data-ltretry="${k}">🔄 Tentar de novo</button>`
  :`<button class="complete" data-ltsubmit="${k}" ${ltReady(a,k)?'':'disabled'}>🧪 Concluir teste</button>`;
 return `<p class="msg" style="margin:0 0 10px">5 perguntas escritas + 1 resposta longa · passas com 3 certas</p>`+qs+open+fim;
}
function ltSubmit(k){
 const a=state.area,t=lt(a,k),ids=lvSet(a,k),ctx='lt:'+a+':'+k;if(!ltReady(a,k))return;
 let s=0;ids.forEach(id=>{const r=rec(ctx,id);r.v=grade(id,r.t);r.c=true;s+=r.v==='ok'?1:r.v==='mid'?.5:0;if(r.v==='no'){if(!state.wrong.includes(id))state.wrong.push(id)}else state.wrong=state.wrong.filter(x=>x!==id)});
 t.done=true;t.score=s;t.pass=s>=3;
 if(t.pass){state.unl[a]=Math.max(state.unl[a],Math.min(lvCount(a),k+2));if(!t.paid){t.paid=true;state.xp+=100}}
 persist();keepScroll(renderApp);
}
function ltRetry(k){const t=lt(state.area,k);t.att++;t.w={};t.done=false;t.score=0;t.pass=false;persist();keepScroll(renderApp)}
function finHTML(){
 const a=state.area,f=state.final[a],ids=finSet(a),ctx='fin:'+a;
 const qs=ids.map((id,k)=>wqHTML(ctx,id,k+1,'test',f.done)).join('');
 const fim=f.done?`<div class="certbox"><h3>${f.score}/10 · ${f.pass?'✅ APROVADO':'❌ AINDA NÃO'}</h3><p class="msg">${f.pass?'Parabéns! A primeira aprovação dá +200 XP.':'Precisas de 7 certas. Revê os erros e tenta outra vez.'}</p></div><button class="complete" data-finretry="1">🔄 Tentar de novo (perguntas novas)</button>`
  :`<button class="complete" data-finsubmit="1" ${finReady(a)?'':'disabled'}>🎓 Concluir avaliação</button>`;
 return `<p class="msg" style="margin:0 0 10px">10 perguntas escritas · aprovação com 7 certas${f.best?' · melhor resultado: '+f.best+'/10':''}</p>`+qs+fim;
}
function finSubmit(){
 const a=state.area,f=state.final[a],ids=finSet(a),ctx='fin:'+a;if(!finReady(a))return;
 let s=0;ids.forEach(id=>{const r=rec(ctx,id);r.v=grade(id,r.t);r.c=true;s+=r.v==='ok'?1:r.v==='mid'?.5:0;if(r.v==='no'){if(!state.wrong.includes(id))state.wrong.push(id)}else state.wrong=state.wrong.filter(x=>x!==id)});
 f.done=true;f.score=s;f.best=Math.max(f.best||0,s);f.pass=s>=7;
 if(f.pass&&!f.paid){f.paid=true;state.xp+=200}
 persist();keepScroll(renderApp);
}
function finRetry(){const f=state.final[state.area];f.att++;f.w={};f.done=false;f.score=0;f.pass=false;persist();keepScroll(renderApp)}
window.addEventListener('resize',updateBar);
renderApp();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
